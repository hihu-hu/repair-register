<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <link rel="icon" type="image/png" href="assets/favicon.png">
    <style>
      :root { --ink:#182026; --muted:#607080; --line:#dce3e8; --accent:#0f7b6c; --accent-dark:#075f54; --soft:#e5f4f1; }
      * { box-sizing:border-box; }
      [hidden] { display:none !important; }
      body { margin:0; min-width:320px; background:#f5f7f8; color:var(--ink); font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif; }
      main { width:min(760px,calc(100% - 28px)); margin:0 auto; padding:24px 0 40px; }
      .page-head { margin-bottom:18px; }
      .eyebrow { margin:0 0 5px; color:var(--accent-dark); font-size:13px; font-weight:700; }
      h1 { margin:0; font-size:clamp(25px,7vw,34px); letter-spacing:0; }
      .lead { margin:8px 0 0; color:var(--muted); line-height:1.6; }
      form, .success { padding:18px; border:1px solid var(--line); border-radius:8px; background:#fff; box-shadow:0 12px 30px rgba(24,32,38,.07); }
      .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:15px; }
      label { display:grid; gap:7px; min-width:0; color:#34434d; font-size:14px; font-weight:700; }
      label.wide { grid-column:1/-1; }
      input, select, textarea { width:100%; min-height:44px; border:1px solid #c4d0d8; border-radius:6px; padding:10px 11px; background:#fff; color:var(--ink); font-size:16px; }
      textarea { min-height:86px; resize:vertical; line-height:1.5; }
      input:focus, select:focus, textarea:focus { outline:2px solid rgba(15,123,108,.18); border-color:var(--accent); }
      .address-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
      .address-grid label { font-size:13px; }
      .form-foot { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:18px; }
      .form-tip { color:var(--muted); font-size:13px; line-height:1.5; }
      button { min-height:44px; border:0; border-radius:7px; padding:0 18px; font:inherit; font-weight:700; cursor:pointer; }
      .primary { background:var(--accent); color:#fff; }
      .primary:hover { background:var(--accent-dark); }
      button:disabled { cursor:not-allowed; opacity:.65; }
      .draft-note { margin:12px 0 0; color:var(--accent-dark); font-size:13px; }
      .error { min-height:22px; margin:12px 0 0; color:#b53636; font-size:14px; line-height:1.5; }
      .success { display:grid; gap:0; }
      .success-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:16px; }
      .success-head h2 { margin:0; font-size:24px; }
      .success-actions { display:flex; gap:8px; }
      .success-actions button { min-height:40px; padding:0 14px; }
      .secondary { border:1px solid #c4d0d8; background:#fff; color:var(--ink); }
      .success-panel { display:grid; gap:5px; padding:15px 18px; border:1px solid #b8e0d9; border-radius:8px; background:#e5f4f1; }
      .success-panel strong { color:var(--accent-dark); font-size:26px; }
      .success-panel span, .success-detail dd { color:#34434d; line-height:1.7; }
      .wechat-card { display:flex; align-items:center; gap:16px; padding:16px; border:1px solid var(--line); border-radius:8px 8px 0 0; background:#fff; }
      .wechat-card strong { font-size:18px; line-height:1.5; }
      .wechat-qr { width:230px; height:230px; object-fit:contain; flex:0 0 auto; }
      .success-detail dl { display:grid; gap:0; margin:0; }
      .success-detail dl div { display:grid; gap:4px; padding:12px 0; border-bottom:1px solid var(--line); }
      .success-detail dt { color:var(--muted); font-weight:700; }
      .success-detail dd { margin:0; font-size:18px; }
      .progress-button { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; min-height:50px; margin-top:18px; background:var(--accent); color:#fff; }
      .progress-button span { font-size:26px; font-weight:400; line-height:1; }
      body.progress-open { overflow:hidden; }
      .progress-page { position:fixed; z-index:20; inset:0; overflow-y:auto; background:#f6f8f9; color:var(--ink); overscroll-behavior:contain; }
      .progress-header { position:sticky; z-index:2; top:0; display:grid; grid-template-columns:44px minmax(0,1fr) 44px; align-items:center; min-height:64px; padding:max(8px,env(safe-area-inset-top)) 14px 8px; border-bottom:1px solid var(--line); background:rgba(255,255,255,.98); }
      .progress-header h2 { margin:0; font-size:20px; text-align:center; }
      .progress-close { display:grid; width:44px; height:44px; min-height:44px; place-items:center; padding:0; border-radius:50%; background:transparent; color:var(--ink); font-size:32px; font-weight:300; line-height:1; }
      .progress-close:hover, .progress-close:focus-visible { background:#eef2f5; outline:none; }
      .progress-content { width:min(680px,100%); min-height:calc(100vh - 64px); margin:0 auto; padding:0 24px calc(44px + env(safe-area-inset-bottom)); background:#fff; }
      .progress-summary { display:flex; align-items:center; justify-content:space-between; gap:16px; margin:0 -24px 28px; padding:20px 24px; border-bottom:1px solid var(--line); background:#f8fafb; }
      .progress-summary div { min-width:0; }
      .progress-summary span, .progress-summary small { display:block; color:var(--muted); font-size:13px; }
      .progress-summary strong { display:block; margin-top:4px; overflow-wrap:anywhere; font-size:18px; }
      .progress-summary small { flex:0 0 auto; padding:6px 9px; border:1px solid #c4d0d8; border-radius:6px; background:#fff; color:#40515d; font-weight:800; }
      .progress-loading { margin-bottom:20px; padding:12px 14px; border-left:4px solid #d79412; background:#fff3d8; color:#6d4a0c; font-size:14px; font-weight:700; }
      .progress-timeline { margin:0; padding:0; list-style:none; }
      .progress-step { position:relative; min-height:112px; padding:2px 0 28px 66px; }
      .progress-step:not(:last-child)::after { position:absolute; top:40px; bottom:-2px; left:20px; width:3px; background:#c4d0d8; content:""; }
      .progress-step.is-complete:not(:last-child)::after { background:#2fb171; }
      .progress-marker { position:absolute; z-index:1; top:0; left:0; display:grid; width:42px; height:42px; place-items:center; border:3px solid #c4d0d8; border-radius:50%; background:#fff; color:#fff; }
      .progress-step.is-complete .progress-marker { border-color:#2fb171; background:#2fb171; }
      .progress-step.is-complete .progress-marker::before { content:"✓"; font-size:25px; line-height:1; }
      .progress-step.is-current .progress-marker { border:10px solid var(--soft); background:#2fb171; box-shadow:0 0 0 2px #2fb171; }
      .progress-step.is-current.is-half-complete .progress-marker { border:3px solid #2fb171; background:linear-gradient(to bottom,#2fb171 0 50%,#fff 50% 100%); box-shadow:none; }
      .progress-step h3 { margin:0; color:#7c8992; font-size:18px; letter-spacing:0; line-height:1.4; }
      .progress-step.is-complete h3 { color:#238659; }
      .progress-step.is-current h3 { color:#238659; }
      .progress-step.is-current.is-half-complete h3 { color:#7c8992; }
      .progress-current-label { display:inline-block; margin-left:8px; padding:3px 7px; border-radius:5px; background:var(--soft); color:var(--accent-dark); font-size:12px; font-weight:800; vertical-align:2px; }
      .progress-time, .progress-note { margin:7px 0 0; color:var(--muted); font-size:14px; line-height:1.6; }
      .progress-note { color:#34434d; white-space:pre-wrap; }
      .progress-repair-suggestion { margin:9px 0 0; color:#34434d; font-size:14px; line-height:1.6; white-space:pre-wrap; }
      .progress-repair-suggestion strong { color:var(--accent-dark); }
      .progress-warranty { display:flex; align-items:baseline; gap:3px; margin:7px 0 0; color:#000; font-size:14px; line-height:1.6; }
      .progress-warranty strong { color:#000; font-weight:400; }
      .progress-quote { margin:7px 0 0; color:#34434d; font-size:14px; line-height:1.6; }
      .progress-accessories { max-width:420px; margin-top:7px; }
      .progress-accessories summary { display:inline; color:#1677d2; font-size:14px; line-height:1.6; cursor:pointer; list-style:none; }
      .progress-accessories summary::-webkit-details-marker { display:none; }
      .progress-accessories summary:focus-visible { outline:2px solid rgba(22,119,210,.25); outline-offset:3px; }
      .progress-accessories ul { display:grid; gap:5px; margin:7px 0 0; padding:7px 0 0; border-top:1px dashed var(--line); list-style:none; }
      .progress-accessories li { display:grid; grid-template-columns:minmax(0,1fr) 120px; align-items:baseline; gap:14px; color:#40515d; font-size:13px; line-height:1.6; }
      .progress-accessories li span:first-child { min-width:0; overflow-wrap:anywhere; }
      .progress-accessories li span:last-child { color:#182026; text-align:left; white-space:nowrap; }
      .payment-guide { display:grid; gap:3px; margin:14px 0 0; color:#40515d; font-size:14px; line-height:1.65; }
      .payment-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
      .payment-confirm { display:inline-flex; align-items:center; justify-content:center; width:auto; min-height:44px; margin-top:10px; padding:0 18px; border:1px solid var(--accent); border-radius:8px; background:var(--accent); color:#fff; font-size:15px; font-weight:700; text-align:center; white-space:nowrap; }
      .payment-actions .payment-confirm { margin-top:0; }
      .payment-confirm:hover, .payment-confirm:focus-visible { background:var(--accent-dark); outline:none; }
      .payment-no-repair { display:inline-flex; align-items:center; justify-content:center; width:auto; min-height:44px; padding:0 18px; border:1px solid #dfb33f; border-radius:8px; background:#fff3cd; color:#6d4a0c; font-size:15px; font-weight:700; text-align:center; white-space:nowrap; }
      .payment-no-repair:hover, .payment-no-repair:focus-visible { background:#ffe69c; border-color:#c99518; outline:none; }
      .no-repair-status { margin:10px 0 0; color:#6d4a0c; font-size:14px; font-weight:700; line-height:1.6; }
      .payment-dialog { width:min(360px,calc(100% - 32px)); padding:0; border:0; border-radius:10px; background:#fff; color:var(--ink); box-shadow:0 18px 50px rgba(24,32,38,.25); }

      .payment-dialog-content { padding:22px; }
      .payment-dialog h3 { margin:0 0 8px; font-size:20px; }
      .payment-dialog p { margin:0; color:var(--muted); line-height:1.6; }

      @media (max-width:560px) {

        .address-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; }
        .address-grid select { padding-left:7px; padding-right:22px; }
        .form-foot { align-items:stretch; flex-direction:column; }

        .success-head { flex-direction:column; }
        .success-actions { width:100%; }
        .success-actions button { flex:1; }
        .wechat-card { align-items:flex-start; flex-direction:column; }
        .wechat-qr { width:230px; height:230px; }
        .progress-content { padding-right:20px; padding-left:20px; }
        .progress-summary { margin-right:-20px; margin-left:-20px; padding-right:20px; padding-left:20px; }
      }
    </style>

  <body>
    <main>
      <header class="page-head">
        <p class="eyebrow">维修登记</p>
        <h1>请填写机器和收件信息</h1>
        <p class="lead">填好后点击提交，维修人员会尽快联系您。填写过程中刷新页面，内容也会自动保留。</p>
      </header>

      <form id="customerForm">
        <div class="form-grid">
          <label><span>寄出快递单号</span><input name="trackingNumber" required placeholder="输入快递公司和单号"></label>
          <label><span>打印机编号</span><input name="deviceNumber" required inputmode="numeric" maxlength="10" pattern="\d{10}" placeholder="打印机底部铭牌上的10位数字"></label>
          <label><span>公司名</span><input name="companyName" required placeholder="在黑端的公司信息里查看"></label>
          <label class="wide"><span>打印机故障原因</span><textarea name="customerIssue" required placeholder="请详细描述打印机哪里坏了"></textarea></label>
          <label class="wide"><span>电源适配器是否寄回</span><select name="powerAdapterReturned" required><option value="">请选择</option><option value="否">否</option><option value="是">是</option></select></label>
          <label><span>收件人（您的名字）</span><input name="contactName" required></label>
          <label><span>您的手机号码</span><input name="phone" required inputmode="numeric" maxlength="11" pattern="\d{11}"></label>
          <div class="wide">
            <label><span>收件地区</span></label>
            <div class="address-grid">
              <select name="addressProvince" required aria-label="省"><option value="">省</option></select>
              <select name="addressCity" required aria-label="市"><option value="">市</option></select>
              <select name="addressDistrict" required aria-label="区县"><option value="">区 / 县</option></select>
              <select name="addressStreet" required aria-label="街道"><option value="">街道 / 乡镇</option></select>
            </div>
          </div>
          <label class="wide"><span>详细地址</span><textarea name="addressDetail" required rows="2" placeholder="门牌号、档口号等详细信息"></textarea></label>
        </div>
        <p class="draft-note" id="draftNote" hidden>已自动保存填写内容</p>
        <p class="error" id="error" role="alert"></p>
        <div class="form-foot"><span class="form-tip">请确认信息填写正确后再提交</span><button class="primary" id="submitBtn" type="submit">提交登记</button></div>
      </form>

      <section class="success" id="success" hidden>
        <div class="success-head">
          <div><p class="eyebrow">最近一次提交</p><h2>您已提交维修登记</h2></div>
          <div class="success-actions"><button class="secondary" id="editBtn" type="button">修改信息</button><button class="primary" id="newBtn" type="button">提交新的记录</button></div>
        </div>
        <div class="success-panel"><strong>登记成功</strong><span>维修人员会尽快处理您的机器信息。</span></div>
        <div class="wechat-card"><img class="wechat-qr" src="assets/enterprise-wechat-qr.png" alt="企业微信二维码"><strong>长按/扫描二维码添加好友（以便咨询维修进度）</strong></div>
        <div class="success-detail" id="successDetail"></div>
        <button class="progress-button" id="viewProgressBtn" type="button" hidden>查看维修进度 <span aria-hidden="true">›</span></button>
      </section>
    </main>
    <section class="progress-page" id="progressPage" aria-label="维修进度查询" hidden>
      <header class="progress-header">
        <button class="progress-close" id="closeProgressBtn" type="button" aria-label="关闭维修进度" title="关闭">×</button>
        <h2>维修进度查询</h2>
        <span aria-hidden="true"></span>
      </header>
      <div class="progress-content">
        <div class="progress-summary" id="progressSummary"></div>
        <div class="progress-loading" id="progressLoading" hidden>正在读取最新进度...</div>
        <ol class="progress-timeline" id="progressTimeline"></ol>
      </div>
    </section>
    <dialog class="payment-dialog" id="paymentConfirmDialog" aria-labelledby="paymentConfirmTitle">
      <div class="payment-dialog-content">
        <h3 id="paymentConfirmTitle">是否已支付维修费？</h3>
        <div class="payment-dialog-actions">
          <button class="secondary" id="paymentNotPaidBtn" type="button">未支付</button>
          <button class="primary" id="paymentPaidBtn" type="button">已支付</button>
        </div>
      </div>
    </dialog>
    <dialog class="payment-dialog" id="noRepairConfirmDialog" aria-labelledby="noRepairConfirmTitle">

        <div class="payment-dialog-actions">

          <button class="payment-no-repair" id="confirmNoRepairBtn" type="button">确认放弃维修</button>
        </div>
      </div>
    </dialog>

        const submissionId = itemValue(submission,"id");

        if (previewSubmission && submissionId === previewSubmission.id) return previewProgressEvents;
        const params = new URLSearchParams({ select:"step_index,occurred_at,detail_text,updated_at", submission_id:`eq.${submissionId}`, order:"step_index.asc" });
        const response = await fetch(`${SUPABASE_URL}/rest/v1/repair_progress_events?${params}`, { headers:{ apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${SUPABASE_ANON_KEY}` } });
        if (!response.ok) throw new Error("progress events unavailable");
        return await response.json();
      }
      async function saveNoRepairRequest(submission) {
        const currentIssue = clean(itemValue(submission,"customer_issue","customerIssue"));
        const customerIssue = [
          ...currentIssue.split("\n").filter((line) => clean(line) !== NO_REPAIR_REQUEST_MARK),
          NO_REPAIR_REQUEST_MARK
        ].filter(Boolean).join("\n");
        const updatedAt = new Date().toISOString();
        const params = new URLSearchParams({ id:`eq.${itemValue(submission,"id")}` });
        const response = await fetch(`${SUPABASE_URL}/rest/v1/customer_repair_submissions?${params}`, {
          method:"PATCH",
          headers:{ apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${SUPABASE_ANON_KEY}`, "Content-Type":"application/json", Prefer:"return=representation" },
          body:JSON.stringify({ customer_issue:customerIssue, updated_at:updatedAt })
        });
        const rows = await response.json().catch(() => []);
        if (!response.ok || !rows[0]) throw new Error("no repair request was not saved");
        return rows[0];
      }
      async function restoreSubmissionIssue(submission, customerIssue) {
        const updatedAt = new Date().toISOString();
        const params = new URLSearchParams({ id:`eq.${itemValue(submission,"id")}` });
        await fetch(`${SUPABASE_URL}/rest/v1/customer_repair_submissions?${params}`, {
          method:"PATCH",
          headers:{ apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${SUPABASE_ANON_KEY}`, "Content-Type":"application/json" },
          body:JSON.stringify({ customer_issue:customerIssue, updated_at:updatedAt })
        });
      }
      async function refreshOpenProgress({ showLoading = false } = {}) {
        if (!activeProgressSubmission || progressPage.hidden || progressRefreshRunning) return;
        progressRefreshRunning = true;
        if (showLoading) {
          progressLoading.textContent = "正在读取最新进度...";
          progressLoading.hidden = false;
        }
        try {
          const [submissionResult,recordResult,eventResult] = await Promise.allSettled([loadSubmission(activeProgressSubmission),loadRepairRecord(activeProgressSubmission),loadProgressEvents(activeProgressSubmission)]);
          if (submissionResult.status === "fulfilled") {
            activeProgressSubmission = submissionResult.value;
            localStorage.setItem(LAST_SUBMISSION_KEY,JSON.stringify(activeProgressSubmission));
          }
          if (recordResult.status === "fulfilled") activeProgressRecord = recordResult.value;
          if (eventResult.status === "fulfilled") activeProgressEvents = eventResult.value;
          renderProgress(activeProgressSubmission,activeProgressRecord,activeProgressEvents);
        } finally {
          progressRefreshRunning = false;
          if (showLoading) progressLoading.hidden = true;
        }
      }
      async function confirmPayment(button) {
        if (!activeProgressSubmission) return;
        if (button.dataset.paymentConfirmed !== "1") {
          pendingPaymentButton = button;
          paymentConfirmDialog.showModal();
          return;
        }
        delete button.dataset.paymentConfirmed;
        button.disabled = true;
        progressLoading.textContent = "正在确认付款...";
        progressLoading.hidden = false;
        try {
          if (previewSubmission && itemValue(activeProgressSubmission,"id") === previewSubmission.id) {
            const now = new Date().toISOString();
            activeProgressEvents = activeProgressEvents.filter((item) => ![5,6].includes(Number(item.step_index ?? item.stepIndex))).concat([
              { submission_id:previewSubmission.id, step_index:5, occurred_at:now, detail_text:"" },
              { submission_id:previewSubmission.id, step_index:6, occurred_at:now, detail_text:"" }
            ]);
          } else {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/confirm_repair_payment`, { method:"POST", headers:{ apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${SUPABASE_ANON_KEY}`, "Content-Type":"application/json" }, body:JSON.stringify({ p_submission_id:itemValue(activeProgressSubmission,"id") }) });
            if (!response.ok) throw new Error("payment confirmation failed");
            activeProgressEvents = await loadProgressEvents(activeProgressSubmission);
          }
          renderProgress(activeProgressSubmission,activeProgressRecord,activeProgressEvents);
          progressLoading.hidden = true;
        } catch {
          button.disabled = false;
          progressLoading.textContent = "确认失败，请检查网络后重试";
          window.setTimeout(() => { progressLoading.hidden = true; progressLoading.textContent = "正在读取最新进度..."; },2600);
          }
      }
      async function requestNoRepair(button) {
        if (!activeProgressSubmission) return;
        if (button.dataset.noRepairConfirmed !== "1") {
          pendingNoRepairButton = button;
          updateNoRepairConfirmText(activeProgressSubmission);
          noRepairConfirmDialog.showModal();
          return;
        }
        delete button.dataset.noRepairConfirmed;
        button.disabled = true;
        progressLoading.textContent = "正在提交无需维修...";
        progressLoading.hidden = false;
        try {
          const originalIssue = clean(itemValue(activeProgressSubmission,"customer_issue","customerIssue"));
          if (previewSubmission && itemValue(activeProgressSubmission,"id") === previewSubmission.id) {
            const now = new Date().toISOString();
            activeProgressSubmission = { ...activeProgressSubmission, customer_issue:`${clean(itemValue(activeProgressSubmission,"customer_issue","customerIssue"))}\n${NO_REPAIR_REQUEST_MARK}`, updated_at:now };
            activeProgressEvents = activeProgressEvents.filter((item) => ![5,6,7].includes(Number(item.step_index ?? item.stepIndex))).concat([
              { submission_id:previewSubmission.id, step_index:5, occurred_at:now, detail_text:NO_REPAIR_CUSTOMER_PROGRESS_MARK, updated_at:now },
              { submission_id:previewSubmission.id, step_index:6, occurred_at:now, detail_text:NO_REPAIR_PROGRESS_MARK, updated_at:now },
              { submission_id:previewSubmission.id, step_index:7, occurred_at:now, detail_text:NO_REPAIR_PROGRESS_MARK, updated_at:now }
            ]);
          } else {
            activeProgressSubmission = await saveNoRepairRequest(activeProgressSubmission);
            localStorage.setItem(LAST_SUBMISSION_KEY,JSON.stringify(activeProgressSubmission));
            let response = null;
            let result = {};
            try {
              response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/skip_repair`, { method:"POST", headers:{ apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${SUPABASE_ANON_KEY}`, "Content-Type":"application/json" }, body:JSON.stringify({ p_submission_id:itemValue(activeProgressSubmission,"id") }) });
              result = await response.json().catch(() => ({}));
              activeProgressEvents = await loadProgressEvents(activeProgressSubmission);
            } catch (error) {
              console.error(error);
            }
            const repairHasStarted = activeProgressEvents.some((item) => [6,7].includes(Number(item.step_index ?? item.stepIndex)) && !isNoRepairProgressEvent(item));
            if (response && !response.ok && repairHasStarted) {
              await restoreSubmissionIssue(activeProgressSubmission,originalIssue);
              activeProgressSubmission = { ...activeProgressSubmission, customer_issue:originalIssue };
              localStorage.setItem(LAST_SUBMISSION_KEY,JSON.stringify(activeProgressSubmission));
              throw new Error(result?.message || "repair progress has already continued");
            }
          }
          renderProgress(activeProgressSubmission,activeProgressRecord,activeProgressEvents);
          progressLoading.textContent = "已放弃维修，当前进度已进入等待发货";
          window.setTimeout(() => { progressLoading.hidden = true; progressLoading.textContent = "正在读取最新进度..."; },2600);
        } catch (error) {
          console.error(error);
          button.disabled = false;
          progressLoading.textContent = error?.message === "repair progress has already continued"
            ? "设备已经开始维修，不能再放弃维修"
            : "提交失败，请检查网络后重试";
          window.setTimeout(() => { progressLoading.hidden = true; progressLoading.textContent = "正在读取最新进度..."; },2600);
        }
      }
      async function openProgress() {
        const submission = JSON.parse(localStorage.getItem(LAST_SUBMISSION_KEY) || "null") || previewSubmission;
        if (!submission) return;
        const openAccessories = progressTimeline.querySelector(".progress-accessories[open]");
        if (openAccessories) openAccessories.open = false;
        renderProgress(submission,null);
        progressPage.hidden = false;
        document.body.classList.add("progress-open");
        document.querySelector("#closeProgressBtn").focus();
        await refreshOpenProgress({ showLoading:true });
      }
      function closeProgress() { progressPage.hidden = true; document.body.classList.remove("progress-open"); document.querySelector("#viewProgressBtn").focus(); }
      function cancelPaymentConfirm() { pendingPaymentButton = null; if (paymentConfirmDialog.open) paymentConfirmDialog.close(); }
      function acceptPaymentConfirm() { const button = pendingPaymentButton; pendingPaymentButton = null; if (paymentConfirmDialog.open) paymentConfirmDialog.close(); if (!button) return; button.dataset.paymentConfirmed = "1"; confirmPayment(button); }
      function cancelNoRepairConfirm() { pendingNoRepairButton = null; if (noRepairConfirmDialog.open) noRepairConfirmDialog.close(); }
      function acceptNoRepairConfirm() { const button = pendingNoRepairButton; pendingNoRepairButton = null; if (noRepairConfirmDialog.open) noRepairConfirmDialog.close(); if (!button) return; button.dataset.noRepairConfirmed = "1"; requestNoRepair(button); }
      if (REPAIR_PROGRESS_ENABLED) {
        paymentPaidBtn.addEventListener("click", acceptPaymentConfirm);
        paymentNotPaidBtn.addEventListener("click", cancelPaymentConfirm);
        paymentConfirmDialog.addEventListener("cancel", cancelPaymentConfirm);
        confirmNoRepairBtn.addEventListener("click", acceptNoRepairConfirm);
        keepRepairBtn.addEventListener("click", cancelNoRepairConfirm);
        noRepairConfirmDialog.addEventListener("cancel", cancelNoRepairConfirm);
        progressTimeline.addEventListener("click", (event) => { const paymentButton = event.target.closest("button[data-payment-confirm]"); if (paymentButton) confirmPayment(paymentButton); const noRepairButton = event.target.closest("button[data-no-repair]"); if (noRepairButton) requestNoRepair(noRepairButton); });
        window.setInterval(() => { if (activeProgressSubmission && !progressPage.hidden) refreshOpenProgress(); },5000);
      }
      async function notifyNewSubmission(submissionId) {
        let lastError = new Error("企微推送失败");
        for (let attempt = 0; attempt < 3; attempt += 1) {
          try {
            const response = await fetch(NEW_SUBMISSION_PUSH_URL, {
              method:"POST",
              headers:{ apikey:SUPABASE_ANON_KEY, "Content-Type":"application/json" },
              body:JSON.stringify({ submissionId }),
              keepalive:true
            });
            const result = await response.json().catch(() => ({}));
            if (!response.ok || result.ok === false) throw new Error(result.error || "企微推送失败");
            return;
          } catch (error) {
            lastError = error;
            if (attempt < 2) await new Promise((resolve) => window.setTimeout(resolve,1500 * (attempt + 1)));
          }
        }
        throw lastError;
      }
      async function submit(event) {
        event.preventDefault();
        errorBox.textContent = "";
        if (!form.reportValidity()) return;
        const message = validate();
        if (message) { errorBox.textContent = message; return; }
        submitBtn.disabled = true;
        submitBtn.textContent = "正在提交";
        const now = new Date().toISOString();
        const data = { id:`customer-${Date.now()}-${Math.random().toString(16).slice(2)}`, created_time:now, device_number:clean(form.elements.deviceNumber.value), model:inferModel(form.elements.deviceNumber.value), company_name:clean(form.elements.companyName.value), contact_name:clean(form.elements.contactName.value), phone:clean(form.elements.phone.value), tracking_number:clean(form.elements.trackingNumber.value), customer_issue:`电源适配器是否寄回：${clean(form.elements.powerAdapterReturned.value)}\n故障描述：${clean(form.elements.customerIssue.value)}`, customer_address:addressText(), updated_at:now };
        try {
          const response = await fetch(`${SUPABASE_URL}/rest/v1/customer_repair_submissions?on_conflict=id`, { method:"POST", headers:{ apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${SUPABASE_ANON_KEY}`, "Content-Type":"application/json", Prefer:"resolution=merge-duplicates,return=representation" }, body:JSON.stringify(data) });
          const savedRows = await response.json().catch(() => []);
          if (!response.ok || !savedRows[0]) throw new Error();
          const savedData = savedRows[0];
          localStorage.removeItem(DRAFT_KEY);
          localStorage.setItem(LAST_SUBMISSION_KEY,JSON.stringify(savedData));
          history.replaceState(null,"",`${location.pathname}?submitted=1`);
          showCachedSuccess(savedData);
          notifyNewSubmission(savedData.id).catch((error) => console.error("企微推送失败",error));
        } catch {
          errorBox.textContent = "提交失败，信息还没有保存，请检查网络后重试";
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "提交登记";
        }
      }
      function showForm() { success.hidden = true; form.hidden = false; errorBox.textContent = ""; }
      function restoreLastSubmissionView() { if (document.hidden || new URLSearchParams(location.search).get("entry") === "edit") return; try { showCachedSuccess(JSON.parse(localStorage.getItem(LAST_SUBMISSION_KEY) || "null")); } catch {} }
      form.addEventListener("input", saveDraft);
      form.addEventListener("change", saveDraft);
      form.elements.deviceNumber.addEventListener("input", () => {
        form.elements.deviceNumber.value = form.elements.deviceNumber.value.replace(/\D/g, "").slice(0,10);
      });
      form.elements.phone.addEventListener("input", () => {
        form.elements.phone.value = form.elements.phone.value.replace(/\D/g, "").slice(0,11);
      });
      form.elements.addressProvince.addEventListener("change", updateCities);
      form.elements.addressCity.addEventListener("change", updateDistricts);
      form.elements.addressDistrict.addEventListener("change", updateStreets);
      form.addEventListener("submit", submit);
      document.querySelector("#newBtn").addEventListener("click", () => {
        form.reset();
        draftNote.hidden = true;
        history.replaceState(null, "", location.pathname);
        showForm();
      });
      document.querySelector("#editBtn").addEventListener("click", () => {
        const item = JSON.parse(localStorage.getItem(LAST_SUBMISSION_KEY) || "null");
        if (item) {
          form.elements.deviceNumber.value = item.device_number || item.deviceNumber || "";
          form.elements.companyName.value = item.company_name || item.companyName || "";
          form.elements.contactName.value = item.contact_name || item.contactName || "";
          form.elements.phone.value = item.phone || "";
          form.elements.trackingNumber.value = item.tracking_number || item.trackingNumber || "";
          form.elements.customerIssue.value = (item.customer_issue || item.customerIssue || "").replace(/^电源适配器是否寄回：[^\n]+\n?/, "");
          form.elements.powerAdapterReturned.value = item.power_adapter_returned || item.powerAdapterReturned || ((item.customer_issue || "").match(/电源适配器是否寄回：([^\n]+)/) || ["", ""])[1];
        }
        history.replaceState(null, "", `${location.pathname}?entry=edit`);
        showForm();
      });
      if (REPAIR_PROGRESS_ENABLED) {
        document.querySelector("#viewProgressBtn").addEventListener("click", openProgress);
        document.querySelector("#closeProgressBtn").addEventListener("click", closeProgress);
        progressTimeline.addEventListener("change", (event) => {
          const checkbox = event.target.closest("input[data-payment-confirm]");
          if (checkbox) confirmPayment(checkbox);
        });
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && !progressPage.hidden) closeProgress();
        });
      }
      document.addEventListener("visibilitychange", restoreLastSubmissionView);
      window.addEventListener("pageshow", restoreLastSubmissionView);
      try {
        showCachedSuccess(JSON.parse(localStorage.getItem(LAST_SUBMISSION_KEY) || "null") || previewSubmission);
      } catch {}
      loadAreas();
    </script>
  </body>
